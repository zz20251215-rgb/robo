<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="2-RSS+1-U 并联踝关节运动学、静力学与传力特性交互工作台" />
    <title>ANKLE · 2-RSS+1-U 踝关节工作台</title>
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="9" cy="10" r="3.2" />
          <circle cx="23" cy="10" r="3.2" />
          <circle cx="16" cy="24" r="3.2" />
          <path d="M9 10 16 24M23 10 16 24M9 10h14" />
        </svg>
        <div class="brand-text">
          <strong>ANKLE</strong>
          <span>2-RSS+1-U 并联踝关节工作台</span>
        </div>
      </div>
      <div class="topbar-actions">
        <span class="pill" id="health-pill" data-level="healthy">
          <i></i>
          <span id="health-text">传动正常</span>
        </span>
        <button class="btn" id="btn-gait" aria-pressed="false">
          <span class="gait-dot"></span>
          <span id="gait-text">步态演示</span>
        </button>
        <button class="btn ghost" id="btn-export">导出数据</button>
        <button class="btn ghost" id="btn-reset-pose">复位姿态</button>
      </div>
    </header>

    <main class="workspace">
      <section class="stage card">
        <div class="stage-view">
          <canvas id="scene" aria-label="2-RSS+1-U 机构三维视图"></canvas>
          <div class="stage-top">
            <div class="segmented" role="group" aria-label="视点">
              <button data-view="iso" aria-pressed="true">轴测</button>
              <button data-view="side" aria-pressed="false">侧视</button>
              <button data-view="front" aria-pressed="false">正视</button>
              <button data-view="top" aria-pressed="false">俯视</button>
            </div>
            <div class="stage-toggles">
              <button class="chip" id="btn-toggle-frames" aria-pressed="true">坐标系</button>
              <button class="chip" id="btn-toggle-motor-axes" aria-pressed="true">电机轴</button>
            </div>
          </div>
          <details class="card floating-card" open>
            <summary>
              <h2>机构尺寸</h2>
              <span class="hint">mm</span>
            </summary>
            <div class="card-body params">
              <label class="switch-row" for="link-chains">
                <input type="checkbox" id="link-chains" />
                <span>对称联动</span>
                <small>以 A 链为基准镜像到 B 链</small>
              </label>

              <p class="param-group">共用基准</p>
              <div class="field compact">
                <label for="param-anchor-h">足端铰点高度<output data-param-value="shared.anchorHeight">-20</output></label>
                <input type="range" id="param-anchor-h" data-param="shared.anchorHeight" min="-50" max="10" step="1" value="-20" />
              </div>

              <div class="param-grid">
                <p class="param-group">支链 A · +Y 侧</p>
                <p class="param-group">支链 B · −Y 侧</p>

                <div class="field compact">
                  <label for="param-a-mount">安装高度<output data-param-value="A.baseZ">185</output></label>
                  <input type="range" id="param-a-mount" data-param="A.baseZ" min="110" max="280" step="1" value="185" />
                </div>
                <div class="field compact">
                  <label for="param-b-mount">安装高度<output data-param-value="B.baseZ">180</output></label>
                  <input type="range" id="param-b-mount" data-param="B.baseZ" min="110" max="280" step="1" value="180" />
                </div>

                <div class="field compact">
                  <label for="param-a-basex">电机 X<output data-param-value="A.baseX">-40</output></label>
                  <input type="range" id="param-a-basex" data-param="A.baseX" min="-80" max="20" step="1" value="-40" />
                </div>
                <div class="field compact">
                  <label for="param-b-basex">电机 X<output data-param-value="B.baseX">-40</output></label>
                  <input type="range" id="param-b-basex" data-param="B.baseX" min="-80" max="20" step="1" value="-40" />
                </div>

                <div class="field compact">
                  <label for="param-a-basey">电机 Y<output data-param-value="A.baseY">35</output></label>
                  <input type="range" id="param-a-basey" data-param="A.baseY" min="10" max="80" step="1" value="35" />
                </div>
                <div class="field compact">
                  <label for="param-b-basey">电机 Y<output data-param-value="B.baseY">-35</output></label>
                  <input type="range" id="param-b-basey" data-param="B.baseY" min="-80" max="-10" step="1" value="-35" />
                </div>

                <div class="field compact">
                  <label for="param-a-crank">曲柄<output data-param-value="A.crank">45</output></label>
                  <input type="range" id="param-a-crank" data-param="A.crank" min="25" max="80" step="1" value="45" />
                </div>
                <div class="field compact">
                  <label for="param-b-crank">曲柄<output data-param-value="B.crank">45</output></label>
                  <input type="range" id="param-b-crank" data-param="B.crank" min="25" max="80" step="1" value="45" />
                </div>

                <div class="field compact">
                  <label for="param-a-rod">连杆<output data-param-value="A.rod">165</output></label>
                  <input type="range" id="param-a-rod" data-param="A.rod" min="100" max="260" step="1" value="165" />
                </div>
                <div class="field compact">
                  <label for="param-b-rod">连杆<output data-param-value="B.rod">165</output></label>
                  <input type="range" id="param-b-rod" data-param="B.rod" min="100" max="260" step="1" value="165" />
                </div>

                <div class="field compact">
                  <label for="param-a-anchorx">铰点 X<output data-param-value="A.anchorX">-30</output></label>
                  <input type="range" id="param-a-anchorx" data-param="A.anchorX" min="-60" max="60" step="1" value="-30" />
                </div>
                <div class="field compact">
                  <label for="param-b-anchorx">铰点 X<output data-param-value="B.anchorX">-30</output></label>
                  <input type="range" id="param-b-anchorx" data-param="B.anchorX" min="-60" max="60" step="1" value="-30" />
                </div>

                <div class="field compact">
                  <label for="param-a-anchory">铰点 Y<output data-param-value="A.anchorY">30</output></label>
                  <input type="range" id="param-a-anchory" data-param="A.anchorY" min="10" max="34" step="1" value="30" />
                </div>
                <div class="field compact">
                  <label for="param-b-anchory">铰点 Y<output data-param-value="B.anchorY">-30</output></label>
                  <input type="range" id="param-b-anchory" data-param="B.anchorY" min="-34" max="-10" step="1" value="-30" />
                </div>
              </div>
            </div>
            <div class="card-actions">
              <button class="btn tiny ghost" id="btn-reset-params">恢复默认</button>
            </div>
          </details>
          <div class="stage-readout" id="pose-readout">Pitch +0.0° Roll +0.0°</div>
          <div class="stage-hint">拖拽旋转 · 滚轮缩放</div>
        </div>
        <div class="metrics">
          <div class="metric">
            <span class="metric-label">θ₁ 电机 1</span>
            <span class="metric-value" id="m-theta1">—</span>
          </div>
          <div class="metric">
            <span class="metric-label">θ₂ 电机 2</span>
            <span class="metric-value" id="m-theta2">—</span>
          </div>
          <div class="metric">
            <span class="metric-label">τ₁ 力矩</span>
            <span class="metric-value" id="m-tau1">—</span>
          </div>
          <div class="metric">
            <span class="metric-label">τ₂ 力矩</span>
            <span class="metric-value" id="m-tau2">—</span>
          </div>
          <div class="metric">
            <span class="metric-label">μ 最小传力角</span>
            <span class="metric-value" id="m-mu">—</span>
          </div>
          <div class="metric">
            <span class="metric-label">κ 条件数</span>
            <span class="metric-value" id="m-cond">—</span>
          </div>
        </div>
      </section>

      <aside class="rail">
        <section class="card">
          <header class="card-head">
            <h2>位姿</h2>
            <span class="hint" id="fk-status"></span>
          </header>
          <div class="card-body">
            <canvas id="pad" class="pad" aria-label="俯仰横滚触控盘"></canvas>
            <div class="pad-legend">
              <span><i data-level="healthy"></i>安全</span>
              <span><i data-level="caution"></i>预警</span>
              <span><i data-level="singular"></i>奇异</span>
              <span><i data-level="unreachable"></i>无解</span>
            </div>
            <div class="field">
              <label for="slider-pitch">Pitch 俯仰<output id="out-pitch">+0.0°</output></label>
              <input type="range" id="slider-pitch" min="-30" max="25" step="0.5" value="0" />
            </div>
            <div class="field">
              <label for="slider-roll">Roll 横滚<output id="out-roll">+0.0°</output></label>
              <input type="range" id="slider-roll" min="-20" max="20" step="0.5" value="0" />
            </div>
            <div class="segmented wide" role="group" aria-label="驱动模式">
              <button data-mode="ik" aria-pressed="true">逆解驱动</button>
              <button data-mode="fk" aria-pressed="false">电机驱动</button>
            </div>
            <div class="segmented wide" role="group" aria-label="电机角显示">
              <button data-angle="abs" aria-pressed="true">绝对角</button>
              <button data-angle="rel" aria-pressed="false">相对角</button>
            </div>
            <div class="field" id="fk-controls" hidden>
              <label for="slider-theta1">θ₁ 电机 1<output id="out-theta1">+0.0°</output></label>
              <input type="range" id="slider-theta1" min="-45" max="90" step="0.1" value="31.2" />
              <label for="slider-theta2">θ₂ 电机 2<output id="out-theta2">+0.0°</output></label>
              <input type="range" id="slider-theta2" min="-45" max="90" step="0.1" value="31.2" />
            </div>
          </div>
        </section>

        <section class="card diag" id="diagnostics" data-level="healthy">
          <header class="card-head">
            <h2>位形诊断</h2>
            <span class="hint mono" id="diag-meta"></span>
          </header>
          <p class="diag-title" id="diag-title">—</p>
          <p class="diag-advice" id="diag-advice"></p>
          <dl class="diag-grid" id="diag-details"></dl>
          <p class="diag-rod mono" id="rod-lengths"></p>
        </section>

        <details class="card">
          <summary>
            <h2>载荷与压力中心</h2>
            <span class="hint">N · mm</span>
          </summary>
          <div class="card-body params">
            <div class="field compact">
              <label for="load-fz">垂直力 Fz<output data-load-value="Fz">500</output></label>
              <input type="range" id="load-fz" data-load="Fz" min="0" max="1000" step="5" value="500" />
            </div>
            <div class="field compact">
              <label for="load-fx">前后力 Fx<output data-load-value="Fx">0</output></label>
              <input type="range" id="load-fx" data-load="Fx" min="-200" max="200" step="5" value="0" />
            </div>
            <div class="field compact">
              <label for="load-copx">CoP 前后<output data-load-value="x_cop">80</output></label>
              <input type="range" id="load-copx" data-load="x_cop" data-scale="1000" min="-60" max="140" step="5" value="80" />
            </div>
            <div class="field compact">
              <label for="load-copy">CoP 左右<output data-load-value="y_cop">0</output></label>
              <input type="range" id="load-copy" data-load="y_cop" data-scale="1000" min="-30" max="30" step="5" value="0" />
            </div>
          </div>
        </details>
      </aside>
    </main>

    <section class="analysis">
      <header class="analysis-head">
        <h2>分析曲线</h2>
        <span class="hint" id="chart-load-caption"></span>
      </header>
      <div class="charts">
        <figure class="card chart">
          <figcaption>
            <h3>运动学映射</h3>
            <output id="chart-kin-output">—</output>
          </figcaption>
          <canvas id="chart-kinematics" aria-label="电机转角随俯仰角变化曲线"></canvas>
        </figure>
        <figure class="card chart">
          <figcaption>
            <h3>静力学响应</h3>
            <output id="chart-tau-output">—</output>
          </figcaption>
          <canvas id="chart-statics" aria-label="电机力矩随俯仰角变化曲线"></canvas>
        </figure>
        <figure class="card chart">
          <figcaption>
            <h3>传力角质量</h3>
            <output id="chart-mu-output">—</output>
          </figcaption>
          <canvas id="chart-transmission" aria-label="传力角随俯仰角变化曲线"></canvas>
        </figure>
        <figure class="card chart">
          <figcaption>
            <h3>灵巧度</h3>
            <output id="chart-cond-output">—</output>
          </figcaption>
          <canvas id="chart-dexterity" aria-label="条件数随俯仰角变化曲线"></canvas>
        </figure>
      </div>
    </section>

    <footer class="foot">
      <span>闭式逆解 · Newton 正解 · 虚功静力映射</span>
      <span>θ 零位：曲柄垂直向下，中立角约 +31.2°；正角为背屈</span>
    </footer>

    <noscript>该工作台需要启用 JavaScript。</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
