[project]
name = "ankle-ref"
version = "0.1.0"
description = "NumPy reference model for the 2-RSS + 1-U ankle mechanism"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0"]

[project.scripts]
ankle-ref = "ankle_ref.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/src/ankle_ref"]

[tool.uv]
package = true
